<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Light Scheduler card harness</title>
    <style>
      :root {
        color-scheme: dark;
        --primary-color: #2196f3;
        --primary-text-color: #f2f2f2;
        --secondary-text-color: #a8a8a8;
        --card-background-color: #111;
        --ha-card-background: #111;
        --error-color: #ff5252;
      }
      body { width: 500px; margin: 16px auto; background: #080808; font-family: Arial, sans-serif; }
    </style>
    <script>window.customCards = [];</script>
    <script src="../custom_components/light_scheduler/frontend/light-schedule-card.js"></script>
  </head>
  <body>
    <light-schedule-card id="card"></light-schedule-card>
    <script>
      // Shaped like the sensor publishes it: what the user configured, plus the
      // resolved values under their own keys. The second entry has no explicit
      // name and no explicit sensor, so the dialog must show them as hints.
      const mappings = [
        {
          name: "Gavita 3", target_entity_id: "switch.gavita_3",
          power_entity_id: "sensor.gavita_3_power", power_threshold_w: 1,
          display_name: "Gavita 3", resolved_power_entity_id: "sensor.gavita_3_power",
        },
        {
          name: "", target_entity_id: "switch.gavita_4", power_entity_id: "",
          power_threshold_w: 1,
          display_name: "Gavita 4", resolved_power_entity_id: "sensor.gavita_4_power",
        },
      ];
      let states = {
        "sensor.indoor_next_run": {
          entity_id: "sensor.indoor_next_run",
          state: "2026-08-14T18:30:00-03:00",
          attributes: {
            entry_id: "indoor-entry",
            zone_name: "Indoor",
            enabled: true,
            active: false,
            lights_on: 1,
            total_power_w: 624.5,
            entity_mappings: mappings,
            schedule_warnings: { three: "ambiguous_time" },
            lights: [
              { entity_id: "switch.gavita_3", name: "Gavita 3", state: "on", available: true, power_entity_id: "sensor.gavita_3_power", power_w: 624.5 },
              { entity_id: "switch.gavita_4", name: "Gavita 4", state: "off", available: true, power_entity_id: "sensor.gavita_4_power", power_w: 0 },
            ],
            schedules: [
              { id: "one", time: "18:30:00", duration: 14400, interval: 5, days: [0, 1, 2, 3, 4, 5, 6], enabled: true },
              { id: "two", time: "23:00", duration: 3600, interval: 0, days: [0], enabled: false },
              { id: "three", time: "01:30", duration: 5400, interval: 0, days: [6], enabled: true },
              { id: "four", time: "06:00", duration: 3600, interval: 0, days: [1], enabled: false, target_entity_ids: [], warning: "targets_removed" },
            ],
          },
        },
      };
      for (let index = 1; index <= 18; index += 1) {
        states[`switch.gavita_${index}`] = { entity_id: `switch.gavita_${index}`, state: "off", attributes: { friendly_name: `Gavita ${index}` } };
        states[`sensor.gavita_${index}_power`] = { entity_id: `sensor.gavita_${index}_power`, state: "0", attributes: { friendly_name: `Gavita ${index} Power`, device_class: "power", unit_of_measurement: "W" } };
      }
      // The zone switch the header toggle drives, matched by entry_id.
      states["switch.indoor_schedule_enabled"] = {
        entity_id: "switch.indoor_schedule_enabled",
        state: "on",
        attributes: { friendly_name: "Indoor Agendamento", entry_id: "indoor-entry", zone_name: "Indoor" },
      };

      const card = document.querySelector("#card");
      const sensorId = "sensor.indoor_next_run";

      // Minimal fake backend. Like real Home Assistant it publishes a brand new
      // states object every time: mutating the old one in place would leave the
      // card comparing a state against itself and silently skipping the render.
      function applyService(domain, service, data) {
        const sensor = states[sensorId];
        const attributes = { ...sensor.attributes };
        const next = { ...states };
        if (domain === "homeassistant" && data.entity_id === "switch.indoor_schedule_enabled") {
          const on = service === "turn_on";
          next[data.entity_id] = { ...states[data.entity_id], state: on ? "on" : "off" };
          attributes.enabled = on;
        } else if (domain === "light_scheduler" && service === "update_schedule") {
          attributes.schedules = attributes.schedules.map((item) =>
            item.id === data.id ? { ...item, ...data, id: item.id } : item
          );
        } else if (domain === "light_scheduler" && service === "remove_schedule") {
          attributes.schedules = attributes.schedules.filter((item) => item.id !== data.id);
        } else if (domain === "light_scheduler" && service === "add_schedule") {
          attributes.schedules = [...attributes.schedules, { ...data, id: `s${Date.now()}` }];
        } else {
          console.log("callService", domain, service, data);
          return;
        }
        console.log("callService", domain, service, data);
        next[sensorId] = { ...sensor, attributes };
        states = next;
        push();
      }

      function push() {
        card.hass = {
          states,
          config: { time_zone: "America/Sao_Paulo" },
          callService: async (domain, service, data) => applyService(domain, service, data),
        };
      }

      card.setConfig({ entity: sensorId });
      push();
    </script>
  </body>
</html>
