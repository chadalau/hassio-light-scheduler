turn_on_now:
  name: Ligar agora
  description: Liga todas as luzes da zona pela duração informada ou padrão.
  target:
    entity:
      integration: light_scheduler
  fields:
    duration:
      name: Duração
      description: Duração em segundos.
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
stop:
  name: Desligar
  description: Desliga as luzes controladas pela execução atual.
  target:
    entity:
      integration: light_scheduler
add_schedule:
  name: Adicionar agendamento
  target:
    entity:
      integration: light_scheduler
  fields:
    time:
      required: true
      selector: {time: {}}
    days:
      required: true
      selector:
        select:
          multiple: true
          options:
            - {label: Segunda, value: "0"}
            - {label: Terça, value: "1"}
            - {label: Quarta, value: "2"}
            - {label: Quinta, value: "3"}
            - {label: Sexta, value: "4"}
            - {label: Sábado, value: "5"}
            - {label: Domingo, value: "6"}
    duration:
      required: true
      selector: {number: {min: 1, max: 86400, unit_of_measurement: s, mode: box}}
    interval:
      name: Intervalo entre luzes
      description: Espera em segundos entre cada luz ao acender e ao apagar. Use 0 para acionar todas sem espera.
      default: 0
      selector: {number: {min: 0, max: 300, unit_of_measurement: s, mode: box}}
remove_schedule:
  name: Remover agendamento
  target:
    entity:
      integration: light_scheduler
  fields:
    id:
      required: true
      selector: {text: {}}
update_schedule:
  name: Atualizar agendamento
  target:
    entity:
      integration: light_scheduler
  fields:
    id:
      required: true
      selector: {text: {}}
    time:
      selector: {time: {}}
    days:
      selector:
        select:
          multiple: true
          options:
            - {label: Segunda, value: "0"}
            - {label: Terça, value: "1"}
            - {label: Quarta, value: "2"}
            - {label: Quinta, value: "3"}
            - {label: Sexta, value: "4"}
            - {label: Sábado, value: "5"}
            - {label: Domingo, value: "6"}
    duration:
      selector: {number: {min: 1, max: 86400, unit_of_measurement: s, mode: box}}
    interval:
      name: Intervalo entre luzes
      selector: {number: {min: 0, max: 300, unit_of_measurement: s, mode: box}}
    enabled:
      selector: {boolean: {}}
set_schedules:
  name: Definir agendamentos
  target:
    entity:
      integration: light_scheduler
  fields:
    schedules:
      required: true
      selector: {object: {}}
set_zone_options:
  name: Definir opções da zona
  target:
    entity:
      integration: light_scheduler
  fields:
    entity_mappings:
      name: Entradas de iluminação
      description: Lista ordenada com nome, luz ou tomada e sensor de potência.
      selector: {object: {}}
    default_duration:
      selector: {number: {min: 1, max: 86400, unit_of_measurement: s, mode: box}}
    target_entity_ids:
      selector: {entity: {multiple: true, filter: [{domain: light}, {domain: switch}]}}
    power_entity_ids:
      selector: {entity: {multiple: true, filter: [{domain: sensor}]}}
